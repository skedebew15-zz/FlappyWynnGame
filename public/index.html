<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Wynn — Neon Royal Flight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;overflow-x:hidden;overflow-y:auto;background:#0a0a1a;touch-action:auto}
body{
  display:flex;justify-content:center;align-items:flex-start;
  min-height:100vh;
  padding:12px 0;
  font-family:'Inter',system-ui,sans-serif;
  background:linear-gradient(135deg,#0a0a1a 0%,#1a1a3e 50%,#0a0a2a 100%);
}
#gameWrap{display:flex;gap:16px;align-items:flex-start;max-width:860px;width:100%;padding:0 12px}
#gameContainer{
  position:sticky;top:12px;touch-action:none;width:400px;height:600px;flex-shrink:0;
  border-radius:16px;overflow:hidden;
  box-shadow:0 0 50px rgba(155,77,255,0.25),0 8px 32px rgba(0,0,0,0.5);
  border:2px solid rgba(155,77,255,0.3);
}
canvas{display:block;width:100%;height:100%;cursor:pointer}
#musicToggle{position:absolute;top:12px;right:12px;z-index:12;border:1px solid rgba(255,180,245,.35);background:rgba(28,8,55,.72);color:#ffe8ff;border-radius:999px;padding:8px 11px;font-size:12px;cursor:pointer;backdrop-filter:blur(8px);box-shadow:0 0 14px rgba(220,80,255,.18)}
#musicToggle:hover{background:rgba(117,34,144,.8);transform:scale(1.04)}

/* ── Sidebar ── */
#sidebar{
  flex:1;min-width:240px;max-width:360px;min-height:0;height:min(600px, calc(100vh - 24px));max-height:calc(100vh - 24px);
  background:rgba(15,15,40,0.95);
  border-radius:16px;padding:20px;
  border:1px solid rgba(155,77,255,0.2);
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
  display:flex;flex-direction:column;
  backdrop-filter:blur(10px);
}
#sidebar h2{
  font-family:'Press Start 2P',monospace;font-size:13px;color:#9B4DFF;
  text-align:center;margin-bottom:4px;text-shadow:0 0 10px rgba(155,77,255,0.5);
}
.live-dot{
  display:inline-block;width:8px;height:8px;
  background:#9B4DFF;border-radius:50%;margin-right:6px;
  animation:blink 1.5s infinite;vertical-align:middle;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.live-label{display:block;width:100%;font-size:11px;color:#888;margin-bottom:14px;text-align:center;background:none;border:0;padding:0;cursor:pointer;font-family:inherit;overflow-wrap:anywhere;transition:color .2s}.live-label:hover,.live-label:focus{color:#d8a7ff;text-decoration:underline;outline:none}.live-label.copied{color:#7dffb2}
.lb-tabs{display:flex;gap:6px;margin-bottom:12px}
.lb-tab{
  flex:1;padding:8px;text-align:center;font-size:11px;font-weight:700;
  border-radius:8px;cursor:pointer;
  background:rgba(255,255,255,0.05);color:#888;
  border:1px solid transparent;transition:.2s;
}
.lb-tab.active{background:rgba(155,77,255,0.15);color:#9B4DFF;border-color:rgba(155,77,255,0.3)}
.lb-list{flex:1;min-height:0;height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#333 transparent}
.lb-list::-webkit-scrollbar{width:4px}
.lb-list::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
.lb-entry{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;margin-bottom:6px;
  background:rgba(255,255,255,0.03);border-radius:10px;
  border:1px solid transparent;transition:.2s;
}
.lb-entry:hover{background:rgba(155,77,255,0.08);border-color:rgba(155,77,255,0.15)}
.lb-entry.highlight{animation:flashIn 1s ease}
@keyframes flashIn{0%{background:rgba(155,77,255,0.4);transform:scale(1.03)}100%{background:rgba(255,255,255,0.03);transform:scale(1)}}
.lb-rank{
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:13px;border-radius:8px;flex-shrink:0;
}
.lb-rank.r1{background:linear-gradient(135deg,#FFD600,#FF8F00);color:#000}
.lb-rank.r2{background:linear-gradient(135deg,#B0BEC5,#78909C);color:#000}
.lb-rank.r3{background:linear-gradient(135deg,#FF8A65,#E64A19);color:#fff}
.lb-rank.r4{background:rgba(255,255,255,0.08);color:#888}
.lb-info{flex:1;min-width:0}
.lb-name{font-weight:700;font-size:13px;color:#e0e0e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-x{font-size:10px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-score{font-weight:900;font-size:18px;color:#9B4DFF;flex-shrink:0}
.lb-empty{text-align:center;color:#555;font-size:13px;padding:30px 0}
.lb-count{font-size:11px;color:#555;text-align:center;margin-top:8px}
.server-badge{
  font-size:10px;color:#9B4DFF;text-align:center;margin-top:8px;
  padding:4px 8px;background:rgba(155,77,255,0.08);border-radius:6px;
}

/* ── Overlays ── */
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  background:rgba(0,0,0,0.6);z-index:10;transition:opacity .3s;
}
.overlay.hidden{opacity:0;pointer-events:none}
#startScreen .start-logo{display:block;width:min(92%,448px);height:auto;object-fit:contain;margin:0 auto 24px;filter:drop-shadow(0 10px 24px rgba(214,82,255,.28))}
.tap-hint{font-size:18px;color:#fff;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.05)}}

#gameOverScreen .go-title{
  font-family:'Press Start 2P',monospace;font-size:26px;color:#ff5252;
  text-shadow:0 3px 0 #b71c1c;margin-bottom:14px;
}
.go-card{
  background:rgba(20,20,50,0.92);border:2px solid rgba(155,77,255,0.3);
  border-radius:16px;padding:20px 24px;width:320px;backdrop-filter:blur(10px);
}
.go-score-label{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:2px;text-align:center}
.go-score-value{
  font-size:52px;font-weight:900;color:#fff;text-align:center;
  text-shadow:0 0 20px rgba(155,77,255,0.3);
}
.go-medal{text-align:center;font-size:28px;margin:4px 0 10px}
.go-best{font-size:13px;color:#FFD600;text-align:center;margin-bottom:16px}
.go-form{margin-top:8px}
.go-form label{display:block;font-size:11px;color:#888;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.go-form input{
  width:100%;padding:10px 14px;font-size:14px;font-weight:600;
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;color:#fff;outline:none;margin-bottom:10px;
  transition:.2s;font-family:'Inter',sans-serif;
}
.go-form input:focus{border-color:#9B4DFF;background:rgba(155,77,255,0.08)}
.go-form input::placeholder{color:#555}
.go-form .hint{font-size:10px;color:#666;margin:-6px 0 10px}
.btn{
  display:block;width:100%;padding:14px;font-size:16px;font-weight:700;
  color:#fff;border:none;border-radius:12px;cursor:pointer;
  transition:.2s;font-family:'Inter',sans-serif;
}
.btn:hover{transform:scale(1.02)}.btn:active{transform:scale(0.98)}
.btn-primary{background:linear-gradient(135deg,#9B4DFF,#6D28D9);box-shadow:0 4px 15px rgba(155,77,255,0.3)}
.btn-secondary{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);margin-top:8px;font-size:14px}
.btn-secondary:hover{background:rgba(255,255,255,0.12)}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.submit-feedback{text-align:center;font-size:13px;margin-top:10px;min-height:20px;font-weight:600}

/* ── Responsive ── */
@media(max-width:700px){
  body{display:block;min-height:100vh;padding:0;overflow-y:auto}
  #gameWrap{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;min-height:100vh;padding:0 8px 16px}
  #gameContainer{position:relative;top:auto;width:100%;max-width:400px;height:min(600px,55vh);flex:none}
  #sidebar{display:flex;flex:none;width:100%;max-width:400px;height:280px;max-height:none;min-height:280px;padding:14px}
  .lb-list{display:block;flex:none;height:190px;min-height:190px;max-height:190px;overflow-y:auto;overflow-x:hidden}
}
@media(max-width:420px){
  #gameContainer{border-radius:0}
  #sidebar{border-radius:0;padding:14px}
}
</style>
</head>
<body>
<script src="/api-config.js?v=10"></script>
<img id="gameBackground" src="/game-background.png" alt="" style="display:none">

<div id="gameWrap">
  <div id="gameContainer">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <button type="button" id="musicToggle" aria-label="Toggle music">🎵 Music: On</button>

    <div id="startScreen" class="overlay">
      <img class="start-logo" src="/flappy-wynn-logo.png" alt="Flappy Wynn — Server-Verified Leaderboard">
      <div class="tap-hint">Tap or Press Space to Play</div>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
      <div class="go-title">GAME OVER</div>
      <div class="go-card">
        <div class="go-score-label">Score</div>
        <div class="go-score-value" id="finalScore">0</div>
        <div class="go-medal" id="medalDisplay"></div>
        <div class="go-best" id="bestDisplay">Best: 0</div>
        <div class="go-form" id="submitForm">
          <label>Your Name</label>
          <input type="text" id="inputName" placeholder="Enter your name" maxlength="20" autocomplete="off">
          <label>X (Twitter) Username</label>
          <input type="text" id="inputX" placeholder="@yourhandle" maxlength="20" autocomplete="off">
          <div class="hint">Optional — shown on leaderboard</div>
          <button type="button" class="btn btn-primary" id="submitBtn">📤 SUBMIT TO SERVER</button>
          <div class="submit-feedback" id="submitFeedback"></div>
        </div>
        <button type="button" class="btn btn-secondary" id="retryBtn">🔄 PLAY AGAIN</button>
      </div>
    </div>
  </div>

  <div id="sidebar">
    <h2>👑 WYNN LEADERBOARD</h2>
    <button type="button" class="live-label" id="contractAddress" title="Click to copy contract address" aria-label="Copy contract address"><span class="live-dot"></span>CA CvXyWJRq3ZxqifMzAuyUomDvJ8PF8NitXx8HxRLGpump</button>
    <div class="lb-tabs">
      <div class="lb-tab active" data-tab="all">All Time</div>
      <div class="lb-tab" data-tab="today">Today</div>
    </div>
    <div class="lb-list" id="lbList"></div>
    <div class="lb-count" id="lbCount"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  FLAPPY WYNN — Game Client
// ═══════════════════════════════════════════

const canvas = document.getElementById('gameCanvas');
const gameContainer = document.getElementById('gameContainer');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ── DOM ──
const $ = id => document.getElementById(id);
const startScreen    = $('startScreen');
const gameOverScreen = $('gameOverScreen');
const finalScoreEl   = $('finalScore');
const bestDisplayEl  = $('bestDisplay');
const medalDisplayEl = $('medalDisplay');
const submitForm     = $('submitForm');
const inputName      = $('inputName');
const inputX         = $('inputX');
const submitBtn      = $('submitBtn');
const submitFeedback = $('submitFeedback');
const retryBtn       = $('retryBtn');
const musicToggle    = $('musicToggle');
const lbList         = $('lbList');
const lbCount        = $('lbCount');
const lbTabs         = document.querySelectorAll('.lb-tab');
const contractAddress = $('contractAddress');
const CONTRACT_TEXT = 'CvXyWJRq3ZxqifMzAuyUomDvJ8PF8NitXx8HxRLGpump';

async function copyContractAddress(){
  try {
    if(navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(CONTRACT_TEXT);
    else {
      const ta=document.createElement('textarea'); ta.value=CONTRACT_TEXT;
      ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
      ta.focus(); ta.select(); document.execCommand('copy'); ta.remove();
    }
    contractAddress.classList.add('copied');
    contractAddress.setAttribute('title','Copied!');
    setTimeout(()=>{contractAddress.classList.remove('copied');contractAddress.setAttribute('title','Click to copy contract address')},1400);
  } catch(err) { console.warn('Unable to copy contract address:',err); }
}
contractAddress.addEventListener('click',e=>{e.stopPropagation();copyContractAddress()});

// ── Config ──
const configuredApi = window.FLAPPY_WYNN_API_BASE || '';
const API_BASE = (/YOUR-RAILWAY-SERVICE|your-railway-service/i.test(configuredApi)
  ? window.location.origin + '/api'
  : (configuredApi || window.location.origin + '/api')).replace(/\/$/, '');
const GRAVITY       = 0.48;
const FLAP_STRENGTH = -8.2;
const PIPE_SPEED    = 2.6;
const PIPE_WIDTH    = 62;
const PIPE_GAP      = 150;
const PIPE_SPAWN_MS = 1600;
const GROUND_HEIGHT = 70;
const WYNN_X        = 80;
const WYNN_SIZE     = 40;

// ── State ──
let wynnY, wynnV, pipes, score, bestScore, gameState, lastPipe, frame;
let particles = [], groundOffset = 0;
let currentTab = 'all', hasSubmitted = false;
let sessionId = null;
let gameStartTime = 0;
let pipeTimestamps = [];  // timestamps of each scored pipe
bestScore = parseInt(localStorage.getItem('flappyWynnBest') || '0');

// ── Character image ──
const charImg = new Image();
let charReady = false;
let charSprite = null;
charImg.onload = () => {
  // Remove the near-black backdrop while preserving the character's dark outlines.
  const off = document.createElement('canvas');
  off.width = charImg.naturalWidth; off.height = charImg.naturalHeight;
  const octx = off.getContext('2d'); octx.drawImage(charImg, 0, 0);
  const pixels = octx.getImageData(0, 0, off.width, off.height);
  for (let i = 0; i < pixels.data.length; i += 4) {
    const r=pixels.data[i], g=pixels.data[i+1], b=pixels.data[i+2];
    if (r < 24 && g < 24 && b < 24) pixels.data[i+3] = 0;
  }
  octx.putImageData(pixels, 0, 0); charSprite = off; charReady = true;
};
charImg.src = '/wynn-character.png';

// ── Server Session ──
async function getSession() {
  try {
    const res = await fetch(API_BASE + '/session');
    const data = await res.json();
    if (data.ok) sessionId = data.sessionId;
  } catch(e) { console.warn('Session fetch failed:', e); }
}

// ── Leaderboard API ──
let lbPollInterval = null;

async function fetchLeaderboard() {
  try {
    const res = await fetch(API_BASE + '/leaderboard?filter=' + currentTab);
    const data = await res.json();
    if (data.ok) renderLeaderboard(data.entries, data.total);
  } catch(e) {
    lbList.innerHTML = '<div class="lb-empty">⚠️ Server offline</div>';
  }
}

function renderLeaderboard(entries, total) {
  if (!entries || entries.length === 0) {
    lbList.innerHTML = '<div class="lb-empty">No scores yet.<br>Be the first! 🟣</div>';
    lbCount.textContent = '';
    return;
  }
  lbList.innerHTML = entries.map(e => {
    const r = e.rank;
    const rc = r === 1 ? 'r1' : r === 2 ? 'r2' : r === 3 ? 'r3' : 'r4';
    const medal = r === 1 ? '👑' : r === 2 ? '🥈' : r === 3 ? '🥉' : r;
    const xHtml = e.x ? `<div class="lb-x">𝕏 ${esc(e.x)}</div>` : '';
    const hl = (e.name === inputName.value.trim() && e.score === score) ? ' highlight' : '';
    return `<div class="lb-entry${hl}">
      <div class="lb-rank ${rc}">${medal}</div>
      <div class="lb-info"><div class="lb-name">${esc(e.name)}</div>${xHtml}</div>
      <div class="lb-score">${e.score}</div>
    </div>`;
  }).join('');
  lbCount.textContent = `${total} total scores`;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Tab switching
lbTabs.forEach(tab => {
  tab.addEventListener('click', () => {
    lbTabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    fetchLeaderboard();
  });
});

// Start polling
function startPolling() {
  fetchLeaderboard();
  if (lbPollInterval) clearInterval(lbPollInterval);
  lbPollInterval = setInterval(fetchLeaderboard, 5000);
}

// ── Audio: user-supplied background music ──
let audioCtx, musicOn = localStorage.getItem('flappyWynnMusic') !== 'off';
const bgMusic = new Audio('/flappy-wynn-music.mp3');
bgMusic.loop = true;
bgMusic.preload = 'auto';
bgMusic.volume = 0.35;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function startMusic() {
  if (!musicOn) return;
  initAudio();
  bgMusic.play().catch(err => console.warn('Music playback was blocked:', err));
}
function stopMusic() {
  bgMusic.pause();
  bgMusic.currentTime = 0;
}
function resumeMusic() {
  if (musicOn) startMusic();
}
function updateMusicButton(){musicToggle.textContent=musicOn?'🎵 Music: On':'🔇 Music: Off';}
function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
  if (type === 'flap') {
    osc.type='sine'; osc.frequency.setValueAtTime(520,audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(680,audioCtx.currentTime+0.08);
    gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.12);
    osc.start(); osc.stop(audioCtx.currentTime+0.12);
  } else if (type === 'score') {
    osc.type='square'; osc.frequency.setValueAtTime(660,audioCtx.currentTime);
    osc.frequency.setValueAtTime(880,audioCtx.currentTime+0.06);
    gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.15);
    osc.start(); osc.stop(audioCtx.currentTime+0.15);
  } else if (type === 'hit') {
    osc.type='sawtooth'; osc.frequency.setValueAtTime(200,audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60,audioCtx.currentTime+0.25);
    gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.3);
    osc.start(); osc.stop(audioCtx.currentTime+0.3);
  }
}

// ── Particles ──
function spawnParticles(x,y,n,c){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6-2,life:1,decay:.02+Math.random()*.03,size:2+Math.random()*4,color:c})}
function updateParticles(){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life-=p.decay;if(p.life<=0)particles.splice(i,1)}}
function drawParticles(){particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1}

// ── Drawing ──
function drawBackground(){
  // Portrait cover crop of the supplied neon city artwork.
  const bg=document.getElementById('gameBackground');
  if(bg && bg.complete){
    const scale=Math.max(W/bg.naturalWidth,H/bg.naturalHeight);
    const sw=W/scale, sh=H/scale;
    const sx=(bg.naturalWidth-sw)*0.58, sy=(bg.naturalHeight-sh)*0.5;
    ctx.drawImage(bg,sx,sy,sw,sh,0,0,W,H);
  } else { ctx.fillStyle='#16052e';ctx.fillRect(0,0,W,H); }
}
function drawGround(){
  groundOffset=(groundOffset+PIPE_SPEED)%24;
  ctx.fillStyle='#180b31';ctx.fillRect(0,H-GROUND_HEIGHT,W,GROUND_HEIGHT);
  ctx.fillStyle='#ff4fc3';ctx.fillRect(0,H-GROUND_HEIGHT,W,5);
  ctx.fillStyle='#7c35aa';
  for(let x=-groundOffset;x<W;x+=24){ctx.beginPath();ctx.moveTo(x,H-GROUND_HEIGHT+14);ctx.lineTo(x+12,H-GROUND_HEIGHT+6);ctx.lineTo(x+24,H-GROUND_HEIGHT+14);ctx.fill()}
}
function drawPipe(pipe){
  // Safari/iOS-safe obstacle renderer: solid base first, neon gradient as enhancement.
  const topH=Math.max(0,Number(pipe.top)||0), botY=topH+PIPE_GAP;
  const botH=Math.max(0,H-GROUND_HEIGHT-botY);
  const capH=26, capW=PIPE_WIDTH+10, capX=pipe.x-5;
  if(!Number.isFinite(pipe.x) || botH<=0) return;
  ctx.save();
  ctx.globalCompositeOperation='source-over';
  ctx.shadowColor='rgba(255,65,220,.72)';ctx.shadowBlur=12;
  // Solid fallback guarantees visibility on iOS Safari.
  ctx.fillStyle='#8c28b8';ctx.fillRect(pipe.x,0,PIPE_WIDTH,topH);
  ctx.fillRect(pipe.x,botY,PIPE_WIDTH,botH);
  ctx.fillStyle='#d84cda';rRect(capX,topH-capH,capW,capH,4);ctx.fill();
  rRect(capX,botY,capW,capH,4);ctx.fill();
  // Highlight strip and dark outline.
  ctx.shadowBlur=0;ctx.fillStyle='rgba(255,226,255,.30)';
  ctx.fillRect(pipe.x+6,0,7,topH);ctx.fillRect(pipe.x+6,botY,7,botH);
  ctx.strokeStyle='#26063f';ctx.lineWidth=2;
  rRect(capX,topH-capH,capW,capH,4);ctx.stroke();
  rRect(capX,botY,capW,capH,4);ctx.stroke();
  ctx.restore();
}
function rRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}

function drawCharacter(x,y,angle){
  ctx.save();ctx.translate(x,y);ctx.rotate(angle);
  const drawSize = WYNN_SIZE * 2.15;
  if(charReady && charSprite){
    ctx.shadowColor='rgba(255,79,195,.55)';ctx.shadowBlur=10;
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(charSprite,-drawSize/2,-drawSize/2,drawSize,drawSize);
  } else {
    ctx.fillStyle='#f05b9c';ctx.beginPath();ctx.arc(0,0,WYNN_SIZE*.7,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawScore(){
  ctx.save();ctx.font='bold 48px "Inter",system-ui,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillText(score,W/2+2,42);
  ctx.strokeStyle='#3b0b63';ctx.lineWidth=5;ctx.strokeText(score,W/2,40);
  ctx.fillStyle='#fff';ctx.fillText(score,W/2,40);ctx.restore();
}

// ── Game Logic ──
function resetGame(){
  wynnY=H/2-40;wynnV=0;pipes=[];score=0;frame=0;
  particles=[];lastPipe=0;gameState='ready';
  hasSubmitted=false;pipeTimestamps=[];gameStartTime=0;
  submitFeedback.textContent='';submitFeedback.style.color='';
  submitForm.style.display='block';submitBtn.disabled=false;
  submitBtn.textContent='📤 SUBMIT TO SERVER';
  getSession();
}

function flap(){
  initAudio(); startMusic();
  if(gameState==='ready'){
    gameState='playing';startScreen.classList.add('hidden');
    lastPipe=Date.now()-PIPE_SPAWN_MS;gameStartTime=Date.now();
  }
  if(gameState==='playing'){wynnV=FLAP_STRENGTH;playSound('flap');spawnParticles(WYNN_X,wynnY,5,'#E9D5FF')}
}

function die(){
  gameState='over';playSound('hit');
  spawnParticles(WYNN_X,wynnY,20,'#FF5252');spawnParticles(WYNN_X,wynnY,10,'#FFD600');
  if(score>bestScore){bestScore=score;localStorage.setItem('flappyWynnBest',bestScore)}
  const sn=localStorage.getItem('flappyWynnName')||'';
  const sx=localStorage.getItem('flappyWynnX')||'';
  inputName.value=sn;inputX.value=sx;
  setTimeout(()=>{
    finalScoreEl.textContent=score;bestDisplayEl.textContent=`Best: ${bestScore}`;
    if(score>=40)medalDisplayEl.textContent='👑 Diamond Crown';
    else if(score>=20)medalDisplayEl.textContent='🥇 Gold Medal';
    else if(score>=10)medalDisplayEl.textContent='🥈 Silver Medal';
    else if(score>=5)medalDisplayEl.textContent='🥉 Bronze Medal';
    else medalDisplayEl.textContent='';
    gameOverScreen.classList.remove('hidden');
    if(score>0)inputName.focus();
  },600);
}

function collide(){
  const r=WYNN_SIZE*.45;
  if(wynnY+r>H-GROUND_HEIGHT||wynnY-r<0)return true;
  for(const p of pipes){if(WYNN_X+r>p.x&&WYNN_X-r<p.x+PIPE_WIDTH){if(wynnY-r<p.top||wynnY+r>p.top+PIPE_GAP)return true}}
  return false;
}

// ── Submit to Server ──
submitBtn.addEventListener('click', async(e)=>{
  e.stopPropagation();
  if(hasSubmitted){submitFeedback.textContent='⚠️ Already submitted!';submitFeedback.style.color='#FF9800';return}
  if(score===0){submitFeedback.textContent='⚠️ Score is 0 — play first!';submitFeedback.style.color='#FF9800';return}
  const name=inputName.value.trim();
  const xH=inputX.value.trim();
  if(!name){submitFeedback.textContent='⚠️ Please enter your name!';submitFeedback.style.color='#FF9800';inputName.focus();return}

  localStorage.setItem('flappyWynnName',name);
  localStorage.setItem('flappyWynnX',xH);

  submitBtn.disabled=true;
  submitBtn.textContent='⏳ Submitting...';
  submitFeedback.textContent='';

  const gameDurationMs = Date.now() - gameStartTime;

  try{
    const res=await fetch(API_BASE+'/submit',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        name,
        xHandle:xH,
        score,
        sessionId:sessionId||'unknown',
        gameDurationMs,
        pipeTimestamps
      })
    });
    const data=await res.json();
    if(data.ok){
      hasSubmitted=true;
      submitFeedback.innerHTML=`✅ <span style="color:#9B4DFF">Ranked #${data.rank} of ${data.totalPlayers} players!</span>`;
      submitFeedback.style.color='#9B4DFF';
      submitForm.style.display='none';
      fetchLeaderboard();
    }else{
      submitFeedback.textContent='❌ '+(data.error||'Submission rejected');
      submitFeedback.style.color='#ff5252';
      if(data.details)console.warn('Validation details:',data.details);
      submitBtn.disabled=false;
      submitBtn.textContent='📤 SUBMIT TO SERVER';
    }
  }catch(err){
    submitFeedback.textContent='❌ Server unreachable';
    submitFeedback.style.color='#ff5252';
    submitBtn.disabled=false;
    submitBtn.textContent='📤 SUBMIT TO SERVER';
  }
});

[inputName,inputX].forEach(inp=>{
  inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')submitBtn.click()});
  inp.addEventListener('pointerdown',e=>e.stopPropagation());
});

retryBtn.addEventListener('click',e=>{e.stopPropagation();gameOverScreen.classList.add('hidden');resetGame()});
musicToggle.addEventListener('click',e=>{e.stopPropagation(); musicOn=!musicOn; localStorage.setItem('flappyWynnMusic',musicOn?'on':'off'); updateMusicButton(); if(musicOn){initAudio();resumeMusic()}else stopMusic()});
updateMusicButton();

// ── Main Loop ──
let lastTime=0;
function gameLoop(ts){
  requestAnimationFrame(gameLoop);
  if(ts-lastTime<16)return;lastTime=ts;frame++;

  if(gameState==='playing'){
    wynnV+=GRAVITY;wynnY+=wynnV;
    const now=Date.now();
    if(now-lastPipe>PIPE_SPAWN_MS){
      const minT=80,maxT=H-GROUND_HEIGHT-PIPE_GAP-80;
      pipes.push({x:W,top:minT+Math.random()*(maxT-minT),scored:false});
      lastPipe=now;
    }
    pipes.forEach(p=>p.x-=PIPE_SPEED);
    pipes=pipes.filter(p=>p.x+PIPE_WIDTH>-10);
    pipes.forEach(p=>{
      if(!p.scored&&p.x+PIPE_WIDTH<WYNN_X){
        p.scored=true;score++;
        pipeTimestamps.push(Date.now());
        playSound('score');spawnParticles(WYNN_X,wynnY,8,'#FFD600');
      }
    });
    if(collide())die();
  }

  updateParticles();
  drawBackground();pipes.forEach(drawPipe);drawGround();
  const angle=gameState==='playing'?Math.min(Math.max(wynnV*.05,-.5),1.2):Math.sin(frame*.03)*.1;
  if(gameState==='ready')wynnY=H/2-40+Math.sin(frame*.06)*10;
  drawCharacter(WYNN_X,wynnY,angle);drawParticles();
  if(gameState==='playing')drawScore();
}

// ── Events ──
function handleInput(e){
  if(e && e.target && e.target.closest && e.target.closest('button,input')) return;
  if(e && e.cancelable) e.preventDefault();
  if(gameState==='over')return;
  flap();
}
// Listen on the container, not only the canvas: the start/game-over overlays cover it on mobile.
let lastPointerInput=0;
gameContainer.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse' || e.pointerType==='touch' || e.pointerType==='pen'){
    lastPointerInput=Date.now(); handleInput(e);
  }
},{passive:false});
// Android WebViews/browsers that expose touch without Pointer Events.
gameContainer.addEventListener('touchstart',e=>{
  if(e.touches.length===1 && Date.now()-lastPointerInput>350) handleInput(e);
},{passive:false});
document.addEventListener('keydown',e=>{
  if(e.code!=='Space' && e.code!=='ArrowUp') return;
  // Never let Space activate a focused button or scroll the page.
  if(e.cancelable) e.preventDefault();
  if(e.repeat) return;
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if(gameState!=='over') handleInput(e);
},{passive:false});

// ── Init ──
resetGame();startPolling();requestAnimationFrame(gameLoop);
</script>
